[constraints]
max_cycles   = 0
max_coupling = "B"
# Compiler dispatch functions (genExpr, checkStmt, etc.) are inherently complex
# switch-statements; set a high threshold to flag only truly problematic functions.
max_cc       = 120
no_god_files = false   # test/unit/run.js is an intentional test orchestrator

# Compiler pipeline — lower order = higher in the stack (can import higher-order layers).
# Rule: a layer can only import from layers with HIGHER order numbers.
# cli(0) → support(1) → backend(2: js + wasm) → lower(3) → typechecker(4) → parser(5) → lexer(6) → types(7)

[[layers]]
name  = "cli"
paths = ["src/index.js"]
order = 0

[[layers]]
name  = "support"
paths = ["src/compiler.js", "src/resolver.js", "src/dts-parser.js", "src/dev-server.js", "src/minifier.js", "src/cli-core.js", "src/asset-manager.js", "src/vendor.js", "src/test-runner.js"]
order = 1

[[layers]]
name  = "backend"
paths = ["src/backend/js/*", "src/backend/js/stdlib/*", "src/backend/wasm/*", "src/backend/wasm/stdlib/*"]
order = 2

[[layers]]
name  = "lower"
paths = ["src/lower/*"]
order = 3

[[layers]]
name  = "typechecker"
paths = ["src/typechecker/index.js", "src/typechecker/expressions/*", "src/typechecker/statements.js", "src/typechecker/stdlib.js", "src/typechecker/resolve.js", "src/typechecker/assignability.js", "src/typechecker/termination.js", "src/typechecker/stdlib/*"]
order = 4

[[layers]]
name  = "parser"
paths = ["src/templ-parser.js", "src/parser/*"]
order = 5

[[layers]]
name  = "lexer"
paths = ["src/lexer.js", "src/templ-lexer.js"]
order = 6

[[layers]]
name  = "types"
paths = ["src/typechecker/types.js", "src/tokens.js"]
order = 7

# Go standard library (stdlib/, GoFront Go) — same rule: a layer can only import from layers
# with HIGHER order numbers.
# stdlib-top(8) → stdlib-high(9) → stdlib-mid(10) → stdlib-leaf(11)
# stdlib/math and stdlib/hash/fnv are unlayered: they import the built-in math/bits, which
# sentrux resolves by suffix to src/backend/js/stdlib/bits.js (a false layer violation).

[[layers]]
name  = "stdlib-top"
paths = ["stdlib/net/url/*"]
order = 8

[[layers]]
name  = "stdlib-high"
paths = ["stdlib/bufio/*", "stdlib/fmt/*", "stdlib/context/*", "stdlib/container/*", "stdlib/encoding/*", "stdlib/crypto/hmac/*", "stdlib/crypto/md5/*", "stdlib/crypto/sha1/*", "stdlib/crypto/sha512/*", "stdlib/hash/adler32/*", "stdlib/hash/crc32/*"]
order = 9

[[layers]]
name  = "stdlib-mid"
paths = ["stdlib/io/*", "stdlib/hash/*", "stdlib/bytes/*", "stdlib/strings/*", "stdlib/strconv/*", "stdlib/slices/*", "stdlib/maps/*"]
order = 10

[[layers]]
name  = "stdlib-leaf"
paths = ["stdlib/cmp/*", "stdlib/errors/*", "stdlib/iter/*", "stdlib/sort/*", "stdlib/sync/*", "stdlib/unicode/*", "stdlib/crypto/subtle/*"]
order = 11
