[constraints]
max_cycles   = 0
max_coupling = "B"
# Compiler dispatch functions (genExpr, checkStmt, etc.) are inherently complex
# switch-statements; set a high threshold to flag only truly problematic functions.
max_cc       = 120
no_god_files = false   # test/unit/run.js is an intentional test orchestrator

# Compiler pipeline — lower order = higher in the stack (can import higher-order layers).
# Rule: a layer can only import from layers with HIGHER order numbers.
# cli(0) → support(1) → backend(2: js + wasm) → lower(3) → typechecker(4) → parser(5) → lexer(6) → types(7)

[[layers]]
name  = "cli"
paths = ["src/index.js"]
order = 0

[[layers]]
name  = "support"
paths = ["src/compiler.js", "src/link/*", "src/resolver.js", "src/dts-parser.js", "src/cli/*"]
order = 1

[[layers]]
name  = "backend"
paths = ["src/backend/js/*", "src/backend/js/stdlib/*", "src/backend/wasm/*", "src/backend/wasm/stdlib/*", "src/backend/shared/*"]
order = 2

[[layers]]
name  = "lower"
paths = ["src/lower/*"]
order = 3

[[layers]]
name  = "typechecker"
paths = ["src/typechecker/index.js", "src/typechecker/expressions.js", "src/typechecker/constants.js", "src/typechecker/const-fold.js", "src/typechecker/init-order.js", "src/typechecker/statements.js", "src/typechecker/resolve.js", "src/typechecker/assignability.js", "src/typechecker/termination.js", "src/typechecker/stdlib/*"]
order = 4

[[layers]]
name  = "parser"
paths = ["src/parser/*"]
order = 5

[[layers]]
name  = "lexer"
paths = ["src/lexer/lexer.js", "src/lexer/templ-lexer.js"]
order = 6

[[layers]]
name  = "types"
paths = ["src/typechecker/types.js", "src/lexer/tokens.js"]
order = 7

# Go standard library (stdlib/, GoFront Go) — same rule: a layer can only import from layers
# with HIGHER order numbers.
# stdlib-high(9) → stdlib-internal(10) → stdlib-mid(11) → stdlib-leaf(12)
# `*` matches one directory level, `**` any depth; nested packages need `**`.
# scripts/check-layers.js fails when a src or stdlib file matches no layer or a glob matches
# no file. ALLOW in that script lists the only files that may stay unlayered (none today).

[[layers]]
name  = "stdlib-high"
paths = ["stdlib/encoding/json/**", "stdlib/encoding/binary/**"]
order = 9

[[layers]]
name  = "stdlib-internal"
paths = ["stdlib/internal/jsonrt/*"]
order = 10

[[layers]]
name  = "stdlib-mid"
paths = ["stdlib/io/**", "stdlib/hash/**", "stdlib/bytes/**", "stdlib/strings/**", "stdlib/strconv/**", "stdlib/slices/**", "stdlib/sort/**", "stdlib/maps/**", "stdlib/path/**", "stdlib/encoding/hex/**", "stdlib/encoding/base64/**", "stdlib/crypto/**", "stdlib/math/*"]
order = 11

[[layers]]
name  = "stdlib-leaf"
paths = ["stdlib/cmp/**", "stdlib/errors/**", "stdlib/html/**", "stdlib/iter/**", "stdlib/math/bits/**", "stdlib/math/rand/**", "stdlib/sync/**", "stdlib/time/**", "stdlib/unicode/**"]
order = 12
