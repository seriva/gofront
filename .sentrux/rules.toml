[constraints]
max_cycles   = 0
max_coupling = "B"
# Compiler dispatch functions (genExpr, checkStmt, etc.) are inherently complex
# switch-statements; set a high threshold to flag only truly problematic functions.
max_cc       = 120
no_god_files = false   # test/unit/run.js is an intentional test orchestrator

# Compiler pipeline — lower order = higher in the stack (can import higher-order layers).
# Rule: a layer can only import from layers with HIGHER order numbers.
# cli(0) → support(1) → backend(2: js + wasm) → lower(3) → typechecker(4) → parser(5) → lexer(6) → types(7)

[[layers]]
name  = "cli"
paths = ["src/index.js"]
order = 0

[[layers]]
name  = "support"
paths = ["src/compiler.js", "src/link/*", "src/resolver.js", "src/dts-parser.js", "src/dev-server.js", "src/minifier.js", "src/cli-core.js", "src/asset-manager.js", "src/vendor.js", "src/test-runner.js", "src/colors.js", "src/project-config.js", "src/pwa.js"]
order = 1

[[layers]]
name  = "backend"
paths = ["src/backend/js/*", "src/backend/js/stdlib/*", "src/backend/wasm/*", "src/backend/wasm/stdlib/*"]
order = 2

[[layers]]
name  = "lower"
paths = ["src/lower/*"]
order = 3

[[layers]]
name  = "typechecker"
paths = ["src/typechecker/index.js", "src/typechecker/expressions.js", "src/typechecker/constants.js", "src/typechecker/const-fold.js", "src/typechecker/statements.js", "src/typechecker/stdlib.js", "src/typechecker/resolve.js", "src/typechecker/assignability.js", "src/typechecker/termination.js", "src/typechecker/stdlib/*"]
order = 4

[[layers]]
name  = "parser"
paths = ["src/templ-parser.js", "src/parser/*"]
order = 5

[[layers]]
name  = "lexer"
paths = ["src/lexer.js", "src/templ-lexer.js"]
order = 6

[[layers]]
name  = "types"
paths = ["src/typechecker/types.js", "src/tokens.js"]
order = 7

# Go standard library (stdlib/, GoFront Go) — same rule: a layer can only import from layers
# with HIGHER order numbers.
# stdlib-high(9) → stdlib-internal(10) → stdlib-mid(11) → stdlib-leaf(12)
# `*` matches one directory level, `**` any depth; nested packages need `**`.
# scripts/check-layers.js fails when a src or stdlib file matches no layer or a glob matches
# no file. The only allowed gaps (ALLOW in that script) are files that import a built-in
# package which sentrux resolves by suffix to a compiler file (a false layer violation):
# stdlib/math (math/bits -> src/backend/js/stdlib/bits.js) and
# stdlib/internal/jsonrt/{dec,enc}.go (encoding/base64 -> src/backend/js/stdlib/base64.js).

[[layers]]
name  = "stdlib-high"
paths = ["stdlib/encoding/**"]
order = 9

[[layers]]
name  = "stdlib-internal"
paths = ["stdlib/internal/jsonrt/reader.go", "stdlib/internal/jsonrt/scanner.go", "stdlib/internal/jsonrt/indent.go", "stdlib/internal/jsonrt/number.go"]
order = 10

[[layers]]
name  = "stdlib-mid"
paths = ["stdlib/io/**", "stdlib/hash/**", "stdlib/bytes/**", "stdlib/strings/**", "stdlib/strconv/**", "stdlib/slices/**", "stdlib/maps/**"]
order = 11

[[layers]]
name  = "stdlib-leaf"
paths = ["stdlib/cmp/**", "stdlib/errors/**", "stdlib/iter/**", "stdlib/sort/**", "stdlib/sync/**", "stdlib/unicode/**"]
order = 12
